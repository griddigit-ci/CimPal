[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cimpal-client"
dynamic = ["version"]
description = "Python client for the CimPal serve job API (/v1)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "gridDigIt Kft." }]
keywords = ["cim", "cgmes", "shacl", "validation", "rdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "attrs>=23.1",
    "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/griddigit-ci/CimPal"
Documentation = "https://github.com/griddigit-ci/CimPal/blob/devel/docs/guide/python-sdk.md"

[project.optional-dependencies]
# Pinned, so lint and type checks don't change under CI.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "mypy==2.4.0",
    "ruff==0.13.3",
    "build==1.6.1",
    "openapi-python-client==0.26.1",
]

# The package has the CimPal version: <cimpal.version> in the repository's root pom.xml, which only
# the release script changes. An sdist carries the version in its PKG-INFO.
[tool.hatch.version]
path = "../../pom.xml"
pattern = "<cimpal\\.version>(?P<version>[^<]+)</cimpal\\.version>"

[tool.hatch.build.targets.sdist]
include = ["src/cimpal_client", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/cimpal_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: runs against a real CimPal-CLI.jar serve (skipped without Java or the JAR)"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/cimpal_client", "tests"]

# Generated by openapi-python-client; checked by its generator, not held to --strict.
[[tool.mypy.overrides]]
module = "cimpal_client._generated.*"
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/cimpal_client/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "A", "SIM", "RUF"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test tokens
