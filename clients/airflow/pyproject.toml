[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-cimpal"
# version: <cimpal.version> from the root pom.xml; dependencies: also cimpal-client at that version.
dynamic = ["version", "dependencies"]
description = "Apache Airflow provider for CimPal: run CIM/CGMES validations and other CimPal jobs from a DAG"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "gridDigIt Kft." }]
keywords = ["airflow", "airflow-provider", "cim", "cgmes", "shacl", "validation"]
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.entry-points.apache_airflow_provider]
provider_info = "cimpal_provider.get_provider_info:get_provider_info"

[project.urls]
Homepage = "https://github.com/griddigit-ci/CimPal"
Documentation = "https://github.com/griddigit-ci/CimPal/blob/devel/docs/guide/airflow.md"

[project.optional-dependencies]
# Pinned, so lint and type checks don't change under CI.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.13.3",
    "build==1.6.1",
    "respx==0.23.1",
]

[tool.hatch.version]
path = "../../pom.xml"
pattern = "<cimpal\\.version>(?P<version>[^<]+)</cimpal\\.version>"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/cimpal_provider", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/cimpal_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "airflow: needs Apache Airflow (Linux or macOS)",
    "integration: runs a DAG against a real CimPal-CLI.jar serve (skipped without Java or the JAR)",
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/cimpal_provider", "tests"]
# Airflow's base classes are only partly typed.
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "A", "SIM", "RUF"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test tokens
