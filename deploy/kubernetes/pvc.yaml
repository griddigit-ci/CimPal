# /data: the models jobs read and the reports they write. Size it for your models and outputs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cimpal-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
