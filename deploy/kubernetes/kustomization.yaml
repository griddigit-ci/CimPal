#
# CimPal serve on Kubernetes (DEP-6): kubectl apply -k deploy/kubernetes
# The token Secret is created separately (see README.md), so no token is ever committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cimpal
labels:
  - pairs:
      app.kubernetes.io/part-of: cimpal
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Pin a release that contains DEP-6 (token file, /ready, JSON logs), ideally by digest:
#   newTag: <version>@sha256:<digest>   (docker buildx imagetools inspect ghcr.io/griddigit-ci/cimpal:<version>)
images:
  - name: ghcr.io/griddigit-ci/cimpal
    newTag: latest
