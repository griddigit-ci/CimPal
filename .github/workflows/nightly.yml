#
# Nightly checks that are too slow or too noisy for every push (TEST-5 adds its deep tests here).
#
# Service load smoke (DEP-16): one minute of mixed jobs (validation, SPARQL, upload) against
# `serve` from a CLI JAR built from this commit, with scripts/bench/load/run.py. Fails when a job
# doesn't succeed or an SLO is missed (docs/guide/service.md). Runner timings are noisy, so this
# guards against breakage and gross regressions; the capacity numbers come from the manual
# sweep (scripts/bench/load/README.md).
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-smoke:
    name: Service load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the CLI JAR
        run: mvn -B -pl CimPal-CLI -am package -DskipTests

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the SDK
        run: pip install -e clients/python

      - name: Load tool self-test
        run: python -m unittest discover -s scripts/bench/load -p "test_*.py" -v

      - name: Load smoke (60 s, mixed)
        run: >-
          python scripts/bench/load/run.py --start-server --workers 2 --heap 2g
          --scenario small=3,sparql=1,upload=1 --rate 20 --duration 60 --drain 600
          --fail-on-slo --out target/bench/load/nightly --label "nightly smoke"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-smoke
          path: target/bench/load/nightly
          retention-days: 14
          if-no-files-found: ignore
