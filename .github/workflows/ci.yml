name: CI

on:
  push:
    branches: [devel, master]
  pull_request:
    branches: [devel, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Ubuntu runs under Xvfb so the JavaFX test (tagged "gui") gets a display instead of being skipped.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: mvn -B verify

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B verify

      - name: Test summary
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          rows, failed = {}, []
          for path in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              suite = ET.parse(path).getroot()
              module = path.replace(os.sep, "/").split("/")[0]
              r = rows.setdefault(module, [0, 0, 0, 0])
              for i, key in enumerate(("tests", "failures", "errors", "skipped")):
                  r[i] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(f"{case.get('classname')}.{case.get('name')}")
          print(f"### Tests ({os.environ.get('RUNNER_OS', '')})\n")
          if not rows:
              print("No surefire reports found.")
          else:
              print("| Module | Tests | Failures | Errors | Skipped |\n| --- | ---: | ---: | ---: | ---: |")
              total = [0, 0, 0, 0]
              for module, r in rows.items():
                  total = [a + b for a, b in zip(total, r)]
                  print(f"| {module} | " + " | ".join(map(str, r)) + " |")
              print("| **Total** | " + " | ".join(f"**{n}**" for n in total) + " |")
          if failed:
              print("\n**Failing tests:**\n")
              for name in failed:
                  print(f"- `{name}`")
          EOF

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, os
          print(f"\n### Coverage ({os.environ.get('RUNNER_OS', '')})\n")
          paths = sorted(glob.glob("*/target/site/jacoco/jacoco.csv"))
          if not paths:
              print("No JaCoCo reports found.")
          else:
              print("| Module | Line | Branch |\n| --- | ---: | ---: |")
              for path in paths:
                  module = path.replace(os.sep, "/").split("/")[0]
                  lc = lm = bc = bm = 0
                  with open(path, newline="") as f:
                      for row in csv.DictReader(f):
                          lc += int(row["LINE_COVERED"]); lm += int(row["LINE_MISSED"])
                          bc += int(row["BRANCH_COVERED"]); bm += int(row["BRANCH_MISSED"])
                  pct = lambda c, m: f"{100 * c / (c + m):.2f}% ({c}/{c + m})" if c + m else "n/a"
                  print(f"| {module} | {pct(lc, lm)} | {pct(bc, bm)} |")
          EOF

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: CimPal-Coverage/target/site/jacoco-aggregate/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn

  # The CLI image (CI-3). release.yml pushes it for every release tag; this job keeps the
  # Dockerfile and the image behaviour from breaking unnoticed in between. Nothing is pushed.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the CLI JAR
        run: mvn -B -pl CimPal-CLI -am package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Same platforms as the release, so a Dockerfile change that breaks arm64 fails here.
      - name: Build for linux/amd64 and linux/arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly
          -f CimPal-CLI/docker/Dockerfile .

      - name: Build for the smoke test
        run: docker buildx build --load --provenance=false -t cimpal:ci -f CimPal-CLI/docker/Dockerfile .

      - name: Smoke test
        shell: pwsh
        run: ./scripts/Test-DockerImage.ps1 -Image cimpal:ci
