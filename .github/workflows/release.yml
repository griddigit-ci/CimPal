name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compute Windows-compatible version
        id: version
        run: |
          $version = "${{ github.ref_name }}"
          $windowsVersion = $version -replace '\.0(\d)', '.$1'
          Write-Output "windows=$windowsVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Windows version: $windowsVersion"

      - name: Build all modules
        run: mvn -B package -Dwindows.version=${{ steps.version.outputs.windows }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            CimPal-Main/target/CimPal.exe `
            CimPal-Main/target/CimPal.jar `
            CimPal-CLI/target/CimPal-CLI.jar