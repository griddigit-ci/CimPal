name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    outputs:
      cli-sha256: ${{ steps.cli-hash.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build all modules
        run: mvn -B package

      # The docker job checks the CLI JAR it downloads from the release against this hash.
      - name: Hash the CLI JAR
        id: cli-hash
        run: |
          $hash = (Get-FileHash CimPal-CLI/target/CimPal-CLI.jar -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "CimPal-CLI.jar SHA-256: $hash"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            CimPal-Main/target/CimPal.exe `
            CimPal-Main/target/CimPal.jar `
            CimPal-CLI/target/CimPal-CLI.jar

  # The CLI image (CI-3): ghcr.io/<owner>/cimpal:<tag> and :latest, linux/amd64 and linux/arm64.
  # Windows runners cannot build Linux images, so this runs on Ubuntu once the release exists.
  # If it fails, the GitHub release is already out; re-run this job on its own.
  docker:
    name: Docker image
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One image job at a time, so two releases cannot race for `latest`.
    concurrency:
      group: docker-image-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image carries the CimPal-CLI.jar the release has just published, byte for byte.
      - name: Download the released CLI JAR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p CimPal-CLI/target
          gh release download "$TAG" --pattern CimPal-CLI.jar --dir CimPal-CLI/target

      # A release asset can be replaced; the image only takes the JAR the build job produced.
      - name: Verify the JAR against the build job's hash
        env:
          CLI_SHA256: ${{ needs.build-and-release.outputs.cli-sha256 }}
        run: echo "$CLI_SHA256  CimPal-CLI/target/CimPal-CLI.jar" | sha256sum --check --strict -

      # Re-running an older release's job must not move `latest` back to an older version.
      - name: Check whether this is the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          newest="$(gh release view --json tagName --jq .tagName)"
          echo "Newest release: $newest; this release: $TAG"
          if [ "$newest" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      # The BuildKit daemon does the push, so its image is pinned like everything else.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Index annotations as well, so the GHCR page shows the description of a multi-arch image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/cimpal
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=CimPal CLI
            org.opencontainers.image.description=CimPal command-line tools for CIM/CGMES: SHACL validation, RDFS to SHACL, RDF conversion, SPARQL and comparison.
            org.opencontainers.image.vendor=gridDigIt Kft.
            org.opencontainers.image.licenses=EUPL-1.2+
          annotations: |
            org.opencontainers.image.title=CimPal CLI
            org.opencontainers.image.description=CimPal command-line tools for CIM/CGMES: SHACL validation, RDFS to SHACL, RDF conversion, SPARQL and comparison.
            org.opencontainers.image.vendor=gridDigIt Kft.
            org.opencontainers.image.licenses=EUPL-1.2+

      # context: . (not the default Git context), so the downloaded JAR is part of the build.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: CimPal-CLI/docker/Dockerfile
          load: true
          provenance: false
          tags: cimpal:smoke

      - name: Smoke test
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/Test-DockerImage.ps1 -Image cimpal:smoke -ExpectedVersion $env:TAG

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: CimPal-CLI/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          # SBOM attestation with a pinned scanner image.
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9